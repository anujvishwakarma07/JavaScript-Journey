<!-- Now I am going to start an activity, which is designing a card. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tailwind CSS</title>
</head>

<body class="bg-slate-600">
    <h1 class="text-2xl text-yellow-600 text-center bg-gray-800 p-4">A card designed by the pure Tailwind</h1>
    <div class="flex justify-center items-center min-h-screen">
        <div class="w-1/2 border-2 bg-white">
            <div class="flex justify-center items-center flex-col border-2 rounded m-1">
                <div class="font-bold bg-blue-600 text-white w-full text-center p-5"><h1>News you can Trust.</h1></div>
                <div class="flex gap-3  p-5 flex-col justify-center items-center bg-white w-full">
                    <h1 class="font-bold">Stay up to data with the Latest!</h1>
                    <p class="">Subscribe to our newsletter for the news straight into your inbox</p>
                    <input class="bg-blue-100 rounded-full text-center py-2 px-4" type="text" placeholder="you@example.com">
                    <button class="bg-blue-600 text-white py-1.5 px-14 rounded-full">Subscribe Now</button>
                    <p class="font-normal">We value your privacy</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
